<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loading-screen">
        <h1>🌌 Nova Client</h1>
        <p>Loading...</p>
    </div>

    <div id="skin-screen" class="hidden">
        <h1>Choose Your Skin</h1>

        <button onclick="selectSkin('Steve')">
            Steve
        </button>

        <button onclick="selectSkin('Alex')">
            Alex
        </button>
    </div>

    <div id="username-screen" class="hidden">
        <h1>👤 Choose Username</h1>

        <input
            type="text"
            id="username-input"
            placeholder="Username"
        >

        <br><br>

        <button onclick="saveUsername()">
            Continue
        </button>
    </div>

    <div id="main-menu" class="hidden">

        <h1>🌌 Nova Client</h1>

        <p id="username-display"></p>
        <p id="skin-display"></p>

        <button onclick="openSingleplayer()">
            Singleplayer
        </button>

        <button onclick="openMultiplayer()">
            Multiplayer
        </button>

        <button onclick="openSettings()">
            Settings
        </button>

        <button onclick="openProfile()">
            Profile
        </button>

    </div>

    <div id="singleplayer-screen" class="hidden">

        <h1>🎮 Singleplayer</h1>

        <button onclick="openCreateWorld()">
            Create World
        </button>

        <br><br>

        <div id="world-list"></div>

        <br>

        <button onclick="backToMenu()">
            Back
        </button>

    </div>

    <div id="create-world-screen" class="hidden">

        <h1>🌍 Create World</h1>

        <input
            type="text"
            id="world-name"
            placeholder="World Name"
        >

        <br><br>

        <button onclick="createWorld()">
            Create
        </button>

        <button onclick="backToSingleplayer()">
            Back
        </button>

    </div>

    <div id="world-screen" class="hidden">

        <h1 id="world-title">🌍 World</h1>

        <p id="coords">
            X: 0 | Y: 64 | Z: 0
        </p>

        <button onclick="moveNorth()">⬆ Forward</button>

        <br>

        <button onclick="moveWest()">⬅ Left</button>

        <button onclick="moveEast()">➡ Right</button>

        <br>

        <button onclick="moveSouth()">⬇ Back</button>

        <br><br>

        <button onclick="pauseWorld()">
            Pause
        </button>

    </div>

    <div id="multiplayer-screen" class="hidden">

        <h1>🌐 Multiplayer</h1>

        <button>ArchMC</button>

        <br><br>

        <button onclick="closeMultiplayer()">
            Back
        </button>

    </div>

    <div id="settings-screen" class="hidden">

        <h1>⚙ Settings</h1>

        <p>Theme: Dark</p>
        <p>Sound: ON</p>

        <button onclick="closeSettings()">
            Back
        </button>

    </div>

    <div id="profile-screen" class="hidden">

        <h1>👤 Profile</h1>

        <p id="profile-username"></p>
        <p id="profile-skin"></p>
        <p id="profile-worlds"></p>

        <button onclick="closeProfile()">
            Back
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
