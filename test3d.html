<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova 3D World</title>

<style>

body {
    margin: 0;
    overflow: hidden;
}

#info {

    position: fixed;

    top: 10px;
    left: 10px;

    color: white;

    background: rgba(0,0,0,0.5);

    padding: 10px;

    font-family: Arial;

    border-radius: 10px;

    z-index: 100;

}

</style>

</head>
<body>

<div id="info">
X: 0 Z: 0
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

// Camera

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth /
window.innerHeight,
0.1,
1000
);

// Renderer

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

// Lighting

const sun =
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    10,
    20,
    10
);

scene.add(sun);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

// Ground

const grassMaterial =
new THREE.MeshLambertMaterial({
    color: 0x55aa55
});

for (let x = -20; x <= 20; x++) {

    for (let z = -20; z <= 20; z++) {

        const block =
        new THREE.Mesh(
            new THREE.BoxGeometry(),
            grassMaterial
        );

        block.position.set(
            x,
            0,
            z
        );

        scene.add(block);

    }

}

// Tree

const woodMaterial =
new THREE.MeshLambertMaterial({
    color: 0x8b5a2b
});

for (let y = 1; y <= 3; y++) {

    const trunk =
    new THREE.Mesh(
        new THREE.BoxGeometry(),
        woodMaterial
    );

    trunk.position.set(
        0,
        y,
        0
    );

    scene.add(trunk);

}

const leafMaterial =
new THREE.MeshLambertMaterial({
    color: 0x228b22
});

for (let x = -1; x <= 1; x++) {

    for (let z = -1; z <= 1; z++) {

        const leaf =
        new THREE.Mesh(
            new THREE.BoxGeometry(),
            leafMaterial
        );

        leaf.position.set(
            x,
            4,
            z
        );

        scene.add(leaf);

    }

}

// Player

camera.position.set(
    5,
    2,
    8
);

// Mouse / Drag Look

let yaw = 0;
let pitch = 0;

let dragging = false;

let lastX = 0;
let lastY = 0;

window.addEventListener(
    "pointerdown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);

window.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);

window.addEventListener(
    "pointermove",
    e => {

        if (!dragging) return;

        const dx =
        e.clientX - lastX;

        const dy =
        e.clientY - lastY;

        yaw -= dx * 0.01;
        pitch -= dy * 0.01;

        if (pitch > 1.5)
            pitch = 1.5;

        if (pitch < -1.5)
            pitch = -1.5;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);

// WASD

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);

function movePlayer() {

    const speed = 0.12;

    const forwardX =
    Math.sin(yaw);

    const forwardZ =
    Math.cos(yaw);

    if (keys["w"]) {

        camera.position.x +=
        forwardX * speed;

        camera.position.z +=
        forwardZ * speed;

    }

    if (keys["s"]) {

        camera.position.x -=
        forwardX * speed;

        camera.position.z -=
        forwardZ * speed;

    }

    if (keys["a"]) {

        camera.position.x +=
        forwardZ * speed;

        camera.position.z -=
        forwardX * speed;

    }

    if (keys["d"]) {

        camera.position.x -=
        forwardZ * speed;

        camera.position.z +=
        forwardX * speed;

    }

}

// Resize

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

// Game Loop

function animate() {

    requestAnimationFrame(
        animate
    );

    movePlayer();

    const direction =
    new THREE.Vector3();

    direction.x =
    Math.cos(pitch) *
    Math.sin(yaw);

    direction.y =
    Math.sin(pitch);

    direction.z =
    Math.cos(pitch) *
    Math.cos(yaw);

    camera.lookAt(

        camera.position.x +
        direction.x,

        camera.position.y +
        direction.y,

        camera.position.z +
        direction.z

    );

    document.getElementById(
        "info"
    ).textContent =

    "X: " +
    camera.position.x.toFixed(1) +

    " Z: " +
    camera.position.z.toFixed(1);

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
