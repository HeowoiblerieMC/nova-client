<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova 3D World</title>

<style>

body {
    margin: 0;
    overflow: hidden;
}

#fps {

    position: absolute;

    top: 10px;
    left: 10px;

    color: white;
    font-family: Arial;

    background: rgba(0,0,0,0.5);

    padding: 10px;
}

</style>

</head>
<body>

<div id="fps">
X: 0 Z: 0
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

// Camera

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth /
window.innerHeight,
0.1,
1000
);

// Renderer

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

// Light

const light =
new THREE.DirectionalLight(
    0xffffff,
    2
);

light.position.set(
    10,
    20,
    10
);

scene.add(light);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

// Ground

const grassMaterial =
new THREE.MeshLambertMaterial({
    color: 0x55aa55
});

for (let x = -20; x <= 20; x++) {

    for (let z = -20; z <= 20; z++) {

        const block =
        new THREE.Mesh(

            new THREE.BoxGeometry(),
            grassMaterial

        );

        block.position.set(
            x,
            0,
            z
        );

        scene.add(block);

    }

}

// Tree Trunk

const woodMaterial =
new THREE.MeshLambertMaterial({
    color: 0x8b5a2b
});

for (let y = 1; y <= 3; y++) {

    const trunk =
    new THREE.Mesh(

        new THREE.BoxGeometry(),
        woodMaterial

    );

    trunk.position.set(
        0,
        y,
        0
    );

    scene.add(trunk);

}

// Leaves

const leafMaterial =
new THREE.MeshLambertMaterial({
    color: 0x228b22
});

for (let x = -1; x <= 1; x++) {

    for (let z = -1; z <= 1; z++) {

        const leaf =
        new THREE.Mesh(

            new THREE.BoxGeometry(),
            leafMaterial

        );

        leaf.position.set(
            x,
            4,
            z
        );

        scene.add(leaf);

    }

}

// Camera Position

camera.position.set(
    5,
    3,
    8
);

// Controls

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;

    }
);

// Movement

function movePlayer() {

    const speed = 0.1;

    if (keys["w"]) {

        camera.position.z -= speed;

    }

    if (keys["s"]) {

        camera.position.z += speed;

    }

    if (keys["a"]) {

        camera.position.x -= speed;

    }

    if (keys["d"]) {

        camera.position.x += speed;

    }

}

// Resize

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

// Animation

function animate() {

    requestAnimationFrame(
        animate
    );

    movePlayer();

    camera.lookAt(
        0,
        2,
        0
    );

    document.getElementById("fps")
    .textContent =
    "X: " +
    camera.position.x.toFixed(1) +
    " Z: " +
    camera.position.z.toFixed(1);

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
