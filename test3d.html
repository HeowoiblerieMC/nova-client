<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova 3D World</title>

<style>

body {
    margin: 0;
    overflow: hidden;
}

#ui {
    position: fixed;

    left: 20px;
    bottom: 20px;

    z-index: 10;
}

button {

    width: 80px;
    height: 50px;

    margin: 5px;

    font-size: 18px;
}

</style>
</head>

<body>

<div id="ui">

    <button onclick="forward()">
        ⬆
    </button>

    <br>

    <button onclick="left()">
        ⬅
    </button>

    <button onclick="right()">
        ➡
    </button>

    <br>

    <button onclick="backward()">
        ⬇
    </button>

</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

// Ground

const groundMaterial =
new THREE.MeshNormalMaterial();

for (let x = -10; x <= 10; x++) {

    for (let z = -10; z <= 10; z++) {

        const block =
        new THREE.Mesh(
            new THREE.BoxGeometry(),
            groundMaterial
        );

        block.position.set(
            x,
            0,
            z
        );

        scene.add(block);

    }

}

// Tree

for (let y = 1; y <= 3; y++) {

    const trunk =
    new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshNormalMaterial()
    );

    trunk.position.set(
        0,
        y,
        0
    );

    scene.add(trunk);

}

for (let x = -1; x <= 1; x++) {

    for (let z = -1; z <= 1; z++) {

        const leaf =
        new THREE.Mesh(
            new THREE.BoxGeometry(),
            new THREE.MeshNormalMaterial()
        );

        leaf.position.set(
            x,
            4,
            z
        );

        scene.add(leaf);

    }

}

// Camera Position

camera.position.set(
    8,
    5,
    8
);

camera.lookAt(
    0,
    2,
    0
);

// Movement

window.forward = function() {

    camera.position.z -= 1;

};

window.backward = function() {

    camera.position.z += 1;

};

window.left = function() {

    camera.position.x -= 1;

};

window.right = function() {

    camera.position.x += 1;

};

// Resize

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

// Render

function animate() {

    requestAnimationFrame(
        animate
    );

    camera.lookAt(
        0,
        2,
        0
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
