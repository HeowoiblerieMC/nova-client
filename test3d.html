<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova World</title>

<style>

body {
    margin: 0;
    overflow: hidden;
}

#info {

    position: fixed;

    top: 10px;
    left: 10px;

    color: white;

    background: rgba(0,0,0,0.5);

    padding: 10px;

    border-radius: 10px;

    font-family: Arial;

    z-index: 100;
}

</style>

</head>

<body>

<div id="info">
Loading...
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

// LIGHTING

const sun =
new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    10,
    20,
    10
);

scene.add(sun);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

// GROUND

const grassMaterial =
new THREE.MeshLambertMaterial({
    color: 0x55aa55
});

for (let x = -20; x <= 20; x++) {

    for (let z = -20; z <= 20; z++) {

        const block =
        new THREE.Mesh(
            new THREE.BoxGeometry(),
            grassMaterial
        );

        block.position.set(
            x,
            0,
            z
        );

        scene.add(block);

    }

}

// TREE

const woodMaterial =
new THREE.MeshLambertMaterial({
    color: 0x8b5a2b
});

for (let y = 1; y <= 3; y++) {

    const trunk =
    new THREE.Mesh(
        new THREE.BoxGeometry(),
        woodMaterial
    );

    trunk.position.set(
        0,
        y,
        0
    );

    scene.add(trunk);

}

const leafMaterial =
new THREE.MeshLambertMaterial({
    color: 0x228b22
});

for (let x = -1; x <= 1; x++) {

    for (let z = -1; z <= 1; z++) {

        const leaf =
        new THREE.Mesh(
            new THREE.BoxGeometry(),
            leafMaterial
        );

        leaf.position.set(
            x,
            4,
            z
        );

        scene.add(leaf);

    }

}

// PLAYER

camera.position.set(
    5,
    2,
    8
);

// LOOK

let yaw = 0;
let pitch = 0;

let dragging = false;

let lastX = 0;
let lastY = 0;

window.addEventListener(
    "pointerdown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);

window.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);

window.addEventListener(
    "pointermove",
    e => {

        if (!dragging) return;

        const dx =
        e.clientX - lastX;

        const dy =
        e.clientY - lastY;

        yaw -= dx * 0.01;
        pitch -= dy * 0.01;

        if (pitch > 1.5)
            pitch = 1.5;

        if (pitch < -1.5)
            pitch = -1.5;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);

// KEYS

const keys = {};

let velocityY = 0;
let onGround = true;
let sneaking = false;

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

        if (
            e.code === "Space" &&
            onGround
        ) {

            velocityY = 0.25;
            onGround = false;

        }

        if (
            e.key === "Shift"
        ) {

            sneaking = true;

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

        if (
            e.key === "Shift"
        ) {

            sneaking = false;

        }

    }
);

// MOVEMENT

function movePlayer() {

    let speed = 0.12;

    if (sneaking) {

        speed = 0.05;

    }

    const forwardX =
    Math.sin(yaw);

    const forwardZ =
    Math.cos(yaw);

    if (keys["w"]) {

        camera.position.x +=
        forwardX * speed;

        camera.position.z +=
        forwardZ * speed;

    }

    if (keys["s"]) {

        camera.position.x -=
        forwardX * speed;

        camera.position.z -=
        forwardZ * speed;

    }

    if (keys["a"]) {

        camera.position.x +=
        forwardZ * speed;

        camera.position.z -=
        forwardX * speed;

    }

    if (keys["d"]) {

        camera.position.x -=
        forwardZ * speed;

        camera.position.z +=
        forwardX * speed;

    }

}

// RESIZE

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

// GAME LOOP

function animate() {

    requestAnimationFrame(
        animate
    );

    movePlayer();

    velocityY -= 0.01;

    camera.position.y +=
    velocityY;

    if (
        camera.position.y < 2
    ) {

        camera.position.y = 2;

        velocityY = 0;

        onGround = true;

    }

    if (
        sneaking &&
        onGround
    ) {

        camera.position.y = 1.3;

    }

    const direction =
    new THREE.Vector3();

    direction.x =
    Math.cos(pitch) *
    Math.sin(yaw);

    direction.y =
    Math.sin(pitch);

    direction.z =
    Math.cos(pitch) *
    Math.cos(yaw);

    camera.lookAt(

        camera.position.x +
        direction.x,

        camera.position.y +
        direction.y,

        camera.position.z +
        direction.z

    );

    document.getElementById(
        "info"
    ).textContent =

    "X: " +
    camera.position.x.toFixed(1) +

    " Y: " +
    camera.position.y.toFixed(1) +

    " Z: " +
    camera.position.z.toFixed(1);

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
